<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111715"><meta name="apple-mobile-web-app-capable" content="yes"><title>增肌手账 · liu</title>
<style>
:root{color-scheme:dark;--bg:#101613;--card:#1b2420;--line:#334039;--muted:#a8b9ad;--green:#b5ef72;--orange:#ffd097}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf5ef;font:16px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif}main,header{max-width:720px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;padding-bottom:6px}h1{font-size:24px;margin:0}h2{font-size:21px;margin:0 0 14px}h3{font-size:17px;margin:0 0 10px}p{margin:8px 0}.muted,small{color:var(--muted)}.brand{font-size:12px;letter-spacing:3px;color:var(--green)}main{padding-bottom:125px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(125deg,#263c25,#1b2420)}.big{font-size:40px;font-weight:750;line-height:1.2}.green{color:var(--green)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}button,.file{min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:#29382e;color:#edf5ef;font:inherit;cursor:pointer}button.primary{background:var(--green);color:#18220e;border-color:var(--green);font-weight:700}button:disabled{opacity:.45;cursor:default}.danger{color:#ffb7a5}input,select,textarea{width:100%;min-height:46px;padding:10px;border:1px solid #4b5b51;border-radius:10px;background:#101813;color:#edf5ef;font:inherit}textarea{min-height:75px;resize:vertical}label{display:block;margin:8px 0;font-size:14px;color:var(--muted)}input[type=checkbox]{width:25px;min-height:25px;accent-color:var(--green)}.check{min-height:46px;display:flex;align-items:center;gap:10px;color:#edf5ef}progress{width:100%;height:12px;accent-color:var(--green)}.safety{border-left:3px solid var(--orange);color:var(--orange);font-size:14px;padding:10px 12px;background:#30291f;border-radius:8px;margin:12px 0}.photos{display:flex;gap:10px;overflow:auto;padding:10px 0}.photos figure{margin:0;flex:none;width:108px}.photos img{width:108px;height:108px;object-fit:cover;border-radius:10px}.photos button{width:100%;font-size:12px}.file{display:block;text-align:center;color:#edf5ef}.photo-inputs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo-inputs .file{min-width:0}.file input{font-size:13px;margin-top:8px;max-width:100%}nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#152019f5;border-top:1px solid var(--line);padding:9px 6px calc(9px + env(safe-area-inset-bottom));z-index:5}nav button{flex:1;max-width:135px;border:0;background:none;padding:7px 3px;color:var(--muted);font-size:14px}nav button.active{color:var(--green);background:#293b29}#toast{position:fixed;left:16px;right:16px;top:15px;max-width:650px;margin:auto;z-index:10;background:#e4f5dc;color:#19301d;padding:14px;border-radius:12px;box-shadow:0 8px 30px #0008}#toast:empty{display:none}.badge{background:#31452c;border-radius:20px;padding:3px 10px;font-size:12px;color:var(--green)}canvas{width:100%;height:240px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}details{margin:12px 0}summary{min-height:44px;cursor:pointer}.exercise{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center;font-size:12px}.day{background:#101813;border-radius:8px;padding:8px 0}.day.done{color:var(--green)}:focus-visible{outline:2px solid var(--green);outline-offset:3px}@media(max-width:380px){main,header{padding:14px}.card{padding:14px}.grid{gap:5px}}
.exercise{border:1px solid var(--line);border-radius:12px;padding:12px}.completed{border-color:#83d58e;background:#25422d}.completed .tick,.celebration .tick{display:inline-block;animation:pop .45s ease-out}.set-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.set-row>label{flex:1;min-width:65px}.stepper{display:flex;align-items:center;gap:4px}.stepper label{width:72px}.stepper button{padding:8px;min-width:44px}.celebration{position:fixed;inset:0;background:#102719f5;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}.celebration .tick{font-size:100px;color:var(--green)}@keyframes pop{0%{transform:scale(0)}65%{transform:scale(1.3)}100%{transform:scale(1)}}@media(prefers-reduced-motion:reduce){.tick{animation:none!important}}
.notice{padding:12px;border-radius:10px;margin-bottom:14px}.notice.red{background:#492222;color:#ffb5b5;border:1px solid #e96969}.notice.yellow{background:#443822;color:#ffdc91}.notice.blue{background:#20374d;color:#a9d7ff}progress.over{accent-color:#ff6464}.directions{display:flex;gap:12px}.directions label{flex:1;display:flex;align-items:center;gap:6px}.directions input{width:20px;min-height:20px}fieldset{border:1px solid var(--line);border-radius:10px}</style></head><body><header><div><div class="brand">GAIN LOG / 增肌手账</div><h1>每一次，都算数。</h1></div><span class="badge" id="goal-badge">liu · 增肌手账</span></header><main><div class="row between"><label>记录日期<input id="date" type="date"></label><span class="muted" id="date-caption"></span></div><div id="view"></div></main><nav aria-label="主导航"><button data-tab="home">◈ 今日</button><button data-tab="train">▣ 训练</button><button data-tab="food">◉ 饮食</button><button data-tab="report">▤ 报告</button><button data-tab="me">◎ 我的</button></nav><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const FOODS=[['快餐主食',[['肯德基芝士牛肉汉堡','份',540,27],['麦当劳巨无霸','份',550,25],['老北京鸡肉卷','份',480,22]]],['面/粉',[['云南过桥米线大碗','份',600,22],['牛肉面大碗','份',650,26],['炸酱面一碗','份',600,18],['兰州拉面大碗','份',620,24]]],['米饭',[['白米饭一碗200g','碗',230,5]]],['副食',[['鸡米花小份','小份',270,15],['炸鸡腿1个','个',230,18],['薯条小份','小份',220,3],['煎蛋1个','个',90,6]]],['早餐',[['鸡蛋1个50g','个',72,6.3],['紫薯100g','100g',106,1.5],['南瓜100g','100g',26,1],['牛奶250ml','杯',135,8],['乳清蛋白粉30g','勺',120,24]]],['高蛋白',[['鸡胸肉150g','份',165,35]]]].map(([group,items])=>({group,items:items.map(([name,unit,kcal,protein])=>({name,unit,kcal,protein}))}));
const EXERCISES=[['胸',[['杠铃卧推',5],['哑铃卧推',5],['上斜哑铃卧推',5],['蝴蝶机夹胸',2.5],['双杠臂屈伸',0]]],['肩',[['站姿哑铃推举',2.5],['侧平举',2.5],['前平举',2.5],['面拉',2.5],['阿诺德推举',2.5]]],['背',[['引体向上',0],['高位下拉',5],['杠铃划船',5],['坐姿划船',5],['T杠划船',5]]],['腿',[['杠铃深蹲',5],['哈克深蹲',5],['腿举',5],['罗马尼亚硬拉',5],['腿屈伸',2.5],['站姿提踵',2.5]]],['臀',[['臀桥',2.5],['杠铃臀推',5]]],['腹',[['卷腹',0],['悬垂举腿',0],['平板支撑',0],['俄罗斯转体',0]]],['有氧',[['慢跑',0]]]].map(([part,items])=>({part,items:items.map(([name,step])=>({name,part,step:step||2.5,bodyweight:step===0&&name!=='慢跑',timed:name==='平板支撑'}))}));
function exerciseInfo(name){return EXERCISES.flatMap(g=>g.items).find(e=>e.name===name)||{name,part:'自定义',step:2.5,bodyweight:false,timed:false}}
function migrateExercise(e){const info=exerciseInfo(e.name==='哑铃上斜卧推'?'上斜哑铃卧推':e.name);return {name:e.name,part:e.part||info.part,step:e.step||info.step,bodyweight:e.bodyweight??info.bodyweight,timed:e.timed??info.timed,sets:Array.isArray(e.sets)?e.sets:Array.from({length:Math.max(1,e.sets)},()=>({reps:e.reps,weight:e.weight})),distance:e.distance||0,minutes:e.minutes||0,done:e.done}}
function exerciseVolume(e){return e.sets.reduce((v,g)=>v+g.reps*g.weight,0)}
function isRun(e){return e.part==='有氧'}

const STORE='gainlog_data',KEY='gainlog_key',SAFETY='颈椎安全提醒：已有 C3/4–C4/5 退变及左臂麻木，保持颈部中立，避免颈后推举、颈后下拉、重负荷耸肩及颈部受压动作。过顶推举、负重深蹲及俯身划船请先由医生或康复专业人员确认；出现或加重疼痛、麻木立即停止训练并就医。';
const NAMES=['胸+肩','背+腹','腿','有氧跑'],MEALS=['早餐','午餐','晚餐','加餐'];
function currentWeight(data){return Object.entries(data.days).filter(([,d])=>typeof d.weight==='number'&&Number.isFinite(d.weight)).sort(([a],[b])=>b.localeCompare(a))[0]?.[1].weight??null}
function recommend(weight=77.5,direction='增肌'){return Math.round((weight*33+({'增肌':300,'减脂':-500,'保持':0}[direction]))/50)*50}
function defaultGoals(data={days:{}}){return {targetWeight:80,direction:'增肌',calorieBudget:recommend(currentWeight(data)??77.5)}}
function goalWeight(){return currentWeight(state)??77.5}
function calorieLimit(){return state.goals.direction==='保持'?recommend(goalWeight(),'保持'):state.goals.calorieBudget}
function goalText(){return `${state.goals.direction}，目标体重 ${state.goals.targetWeight} kg；`+(state.goals.direction==='增肌'?'蛋白质目标 125–155g':`热量预算 ${calorieLimit()} kcal`+(state.goals.direction==='减脂'?`，蛋白质目标 ${Math.round(goalWeight()*2)} g`:''))}
function bodyText(){return `男183cm，当前体重 ${currentWeight(state)??'未记录'} kg，${goalText()}`}
function nutritionWarnings(){const t=totals(),dir=state.goals.direction,limit=calorieLimit(),list=[];if(dir!=='增肌'&&t.kcal>limit)list.push({key:'daily-high',color:dir==='减脂'?'red':'yellow',text:`⚠️ 今日热量已超预算 ${Math.round(t.kcal-limit)} kcal`});if(dir==='增肌'&&t.kcal<goalWeight()*30)list.push({key:'daily-low',color:'blue',text:`热量偏低，增肌期建议吃到 ${Math.round(goalWeight()*33/50)*50} kcal 以上`});return list}
function warningHTML(w){return `<div class="notice ${w.color}" role="status">${esc(w.text)}</div>`}
function mealAdvice(m,i){if(state.goals.direction!=='减脂')return '';const n=state.goals.calorieBudget*[.25,.35,.3,.1][i];return `<p class="muted">建议 ≤ ${Math.round(n)} kcal</p>`+(m.confirmed&&m.kcal>n*1.2?warningHTML({color:'yellow',text:`本餐超出建议 ${Math.round(m.kcal-n)} kcal`}):'')}
const warningDates=new Set();
function warnOnce(i){const warnings=nutritionWarnings();if(state.goals.direction==='减脂'&&i!==undefined){const m=day().meals[i],n=state.goals.calorieBudget*[.25,.35,.3,.1][i];if(m.confirmed&&m.kcal>n*1.2)warnings.push({key:'meal-'+i,text:`本餐超出建议 ${Math.round(m.kcal-n)} kcal`})}const fresh=warnings.filter(w=>{const key=selected+':'+w.key;if(warningDates.has(key))return false;try{if(localStorage.getItem('gainlog_warning:'+key)==='1'){warningDates.add(key);return false}}catch{}return true});fresh.forEach(w=>{const key=selected+':'+w.key;warningDates.add(key);try{localStorage.setItem('gainlog_warning:'+key,'1')}catch{}});if(fresh.length)toast(fresh.map(w=>w.text).join('；'))}
function defaults(){return {version:2,goals:defaultGoals(),personalFoods:[],templates:[['杠铃卧推','上斜哑铃卧推','蝴蝶机夹胸','站姿哑铃推举','侧平举','面拉'],['引体向上','高位下拉','杠铃划船','坐姿划船','悬垂举腿','卷腹'],['杠铃深蹲','腿举','罗马尼亚硬拉','腿屈伸','站姿提踵'],['慢跑']].map((names,t)=>({name:NAMES[t],exercises:names.map(name=>migrateExercise({name,sets:t===3?0:3,reps:t===3?0:10,weight:0,distance:0,minutes:0,done:false}))})),days:{},reports:{}}}
const clone=o=>JSON.parse(JSON.stringify(o)),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dateKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function validDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&dateKey(new Date(s+'T12:00:00'))===s}
let state=defaults(),apiKey='',mode='local',memoryNoticeShown=false,recoveryError='',tab='home',selected=dateKey(),toastTimer,photoBusy=false,aiBusy=false;
function toast(msg){document.getElementById('toast').textContent=msg;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',7000)}
function memoryMode(){mode='memory';if(!memoryNoticeShown){memoryNoticeShown=true;toast('当前为预览模式：数据仅保留在本次会话，关闭页面会丢失。请用 Safari 打开本文件以永久保存，或先导出备份。')}}
try{const raw=localStorage.getItem(STORE);if(raw){try{state=validateBackup(JSON.parse(raw))}catch(e){recoveryError=e.message;mode='memory'}}apiKey=localStorage.getItem(KEY)||'';if(!recoveryError){localStorage.setItem('gainlog_probe','1');localStorage.removeItem('gainlog_probe')}}catch(e){memoryMode()}

function commit(next){state=next;if(mode==='local'){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){memoryMode()}}return true}
function mutate(fn){const next=clone(state);fn(next);return commit(next)}
function emptyDay(){return {training:null,photos:[],meals:MEALS.map(()=>({note:'',kcal:0,protein:0,photos:[],items:[{name:'',quantity:1}],confirmed:false})),weight:null}}
function day(d=selected){return state.days[d]||emptyDay()}
function editDay(fn,d=selected){return mutate(s=>{s.days[d]??=emptyDay();fn(s.days[d])})}
function totals(d=day()){return d.meals.filter(m=>m.confirmed).reduce((a,m)=>({kcal:a.kcal+m.kcal,protein:a.protein+m.protein}),{kcal:0,protein:0})}
function proteinLabel(p){return p<125?'尚需 '+Math.round((125-p)*10)/10+' g':p<=155?'已达到目标范围':'已超过目标上限，无需继续追量'}
function plan(d=selected){return [3,0,1,2,3,0,1][new Date(d+'T12:00:00').getDay()]}
function streak(d=selected){let n=0,c=new Date(d+'T12:00:00');while(state.days[dateKey(c)]?.training?.status==='complete'){n++;c.setDate(c.getDate()-1)}return n}
function progress(){const t=totals();if(state.goals.direction!=='增肌'){const limit=calorieLimit();return `<div class="card"><h3>今日营养</h3><p class="${t.kcal>limit?'danger':''}">已摄入 ${Math.round(t.kcal)} / 上限 ${limit} kcal</p><progress class="${t.kcal>limit?'over':''}" max="${limit}" value="${Math.min(t.kcal,limit)}" aria-label="热量进度"></progress><p class="muted">蛋白质 ${Number(t.protein.toFixed(1))} g${state.goals.direction==='减脂'?` / 目标 ${Math.round(goalWeight()*2)} g`:''}</p><p class="muted">还有 ${day().meals.filter(m=>!m.confirmed&&(m.kcal||m.protein||m.note||m.photos.length||m.items.some(x=>x.name))).length} 餐待确认</p></div>`}return `<div class="card"><div class="row between"><h3>今日营养</h3><span class="badge">${esc(proteinLabel(t.protein))}</span></div><span class="big green">${Number(t.protein.toFixed(1))}</span> <span class="muted">/ 125–155 g 蛋白质</span><progress max="155" value="${Math.min(t.protein,155)}" aria-label="蛋白质进度"></progress><p class="muted">总热量 ${Math.round(t.kcal)} kcal · 热量需求因活动而异</p><p class="muted">还有 ${day().meals.filter(m=>!m.confirmed&&(m.kcal||m.protein||m.note||m.photos.length||m.items.some(x=>x.name))).length} 餐待确认</p></div>`}
function safety(){return `<div class="safety">${SAFETY}</div>`}
function photosHTML(photos,kind,meal=-1){return `<div class="photos">${photos.map((p,i)=>`<figure><img src="${p}" alt="${kind==='train'?'训练':'饮食'}记录照片 ${i+1}" loading="lazy"><button data-action="delete-photo" data-kind="${kind}" data-meal="${meal}" data-index="${i}">删除照片</button></figure>`).join('')}</div>`}
function photoInput(kind,meal=-1){return `<div class="photo-inputs">${[['📷 拍照',' capture="environment"'],['🖼 相册选择','']].map(([label,capture])=>`<label class="file">${label}<input type="file" accept="image/*"${capture} multiple data-photo="${kind}" data-meal="${meal}" ${photoBusy?'disabled':''}></label>`).join('')}</div>`}
function home(){const d=day(),p=plan();return `${nutritionWarnings().map(warningHTML).join('')}<div class="card hero"><span class="muted">今日训练计划 · ${['周日','周一','周二','周三','周四','周五','周六'][new Date(selected+'T12:00:00').getDay()]}</span><h2>${NAMES[p]}</h2><p>183 cm · 从 ${currentWeight(state)??'未记录'} kg 向 ${state.goals.targetWeight} kg ${{增肌:'稳步前进',减脂:'稳步下降',保持:'保持稳定'}[state.goals.direction]}</p><div class="row"><button class="primary" data-go="train">${d.training?.status==='complete'?'查看今日训练':'去训练打卡'}</button><button data-go="food">记录一餐</button></div></div>${progress()}<div class="card"><h3>今天的积累</h3><p>训练：${d.training?d.training.status==='complete'?'已完成':'进行中':'尚未开始'} · 连续打卡 ${streak()} 天</p><p>体重：${d.weight??'未记录'} ${d.weight?'kg':''}</p><button data-go="report">查看每日小结</button></div>${safety()}`}
function field(label,key,value,index,running=false){return `<label>${label}<input type="number" inputmode="decimal" min="0" max="${key==='weight'?500:key==='distance'?500:key==='minutes'?1440:1000}" step="${key==='sets'||key==='reps'?'1':'0.1'}" value="${value}" data-ex="${index}" data-field="${key}"></label>`}
function train(){const d=day(),t=d.training;return `<div class="card"><h2>训练打卡 · v2.1</h2><label>选择分化模板<select id="template">${NAMES.map((n,i)=>`<option value="${i}" ${(t?.type??plan())===i?'selected':''}>${n}</option>`).join('')}</select></label><div class="row"><button class="primary" data-action="start" ${t?'disabled':''}>开始训练</button>${t?'<button data-action="reset-training">撤销今日训练</button>':''}</div>${safety()}</div>${t?`<div class="card"><h3>${NAMES[t.type]} · ${t.status==='complete'?'已完成':'进行中'}</h3>${t.exercises.map((e,i)=>`<div class="exercise ${e.done?'completed':''}"><label>动作库<select data-ex="${i}" data-field="choice">${EXERCISES.map(g=>`<optgroup label="${g.part}">${g.items.map(x=>`<option ${e.name===x.name?'selected':''}>${x.name}</option>`).join('')}</optgroup>`).join('')}<option value="custom" ${!EXERCISES.flatMap(g=>g.items).some(x=>x.name===e.name)?'selected':''}>自定义动作</option></select></label>${e.part==='自定义'?`<label>自定义名称<input maxlength="80" value="${esc(e.name)}" data-ex="${i}" data-field="name"></label><label>重量步长<select data-ex="${i}" data-field="step"><option value="2.5" ${e.step===2.5?'selected':''}>2.5 kg</option><option value="5" ${e.step===5?'selected':''}>5 kg</option></select></label>`:''}${/推举|深蹲|划船|硬拉|悬垂/.test(e.name)?'<p class="safety">此动作需先确认颈椎安全；不适请停止或替换。</p>':''}${isRun(e)?`<div class="grid">${field('距离 km','distance',e.distance,i)+field('时长 分钟','minutes',e.minutes,i)}<p>配速 ${pace(e)}</p></div>`:e.sets.map((g,j)=>`<div class="set-row"><span>第${j+1}组</span><label>${e.timed?'秒数':'次数'}<input type="number" min="1" max="1000" step="1" value="${g.reps}" data-ex="${i}" data-set="${j}" data-field="reps"></label>${e.bodyweight?'<span class="badge">自重</span>':`<div class="stepper"><button aria-label="减少重量" data-action="step" data-index="${i}" data-set="${j}" data-dir="-1">−</button><label>kg<input aria-label="重量 kg" type="number" min="0" max="500" step="0.1" value="${g.weight}" data-ex="${i}" data-set="${j}" data-field="weight"></label><button aria-label="增加重量" data-action="step" data-index="${i}" data-set="${j}" data-dir="1">＋</button></div>`}<button aria-label="删除第${j+1}组" data-action="remove-set" data-index="${i}" data-set="${j}" ${e.sets.length===1?'disabled':''}>×</button></div>`).join('')}${!isRun(e)?`<button data-action="add-set" data-index="${i}">＋ 添加一组</button>`:''}<div class="row between"><label class="check"><input type="checkbox" data-ex="${i}" data-field="done" ${e.done?'checked':''}><span class="tick">${e.done?'✓':''}</span>本项完成</label><button class="danger" data-action="remove-ex" data-index="${i}">删除动作</button></div></div>`).join('')}<div class="row"><button data-action="add-ex">＋ 新增动作</button><button data-action="save-template">保存为模板</button><button class="primary" data-action="finish" ${t.status==='complete'?'disabled':''}>${finishPending===selected?'确认完成？':'完成训练'}</button></div></div><div class="card"><h3>训练后留影</h3>${photoInput('train')}${photosHTML(d.photos,'train')}</div>`:''}`}
let finishPending=null,celebration=null,celebrationReady=false;
function foodLibrary(){return [...FOODS,{group:'个人食物',items:state.personalFoods}]}
function foodInfo(name){return foodLibrary().flatMap(g=>g.items).find(f=>f.name===name)}
function calculateMeal(m){const t=m.items.reduce((a,x)=>{const f=foodInfo(x.name);return {kcal:a.kcal+(f?.kcal||0)*x.quantity,protein:a.protein+(f?.protein||0)*x.quantity}},{kcal:0,protein:0});m.kcal=Math.round(t.kcal*10)/10;m.protein=Math.round(t.protein*10)/10;delete m.foods;m.source='食物库';m.confirmed=false}
function mealItem(m,i,x,j){const f=foodInfo(x.name);return `<div class="card"><label>${j?'副食品':'主食'}<select data-meal="${i}" data-item="${j}" data-item-field="name" ${m.confirmed?'disabled':''}><option value="">请选择食物</option>${foodLibrary().map(g=>`<optgroup label="${g.group}">${g.items.map(f=>`<option ${f.name===x.name?'selected':''}>${esc(f.name)}</option>`).join('')}</optgroup>`).join('')}</select></label><label>数量（${esc(f?.unit||'份')}）<input type="number" min="0" max="100" step="0.5" value="${x.quantity}" data-meal="${i}" data-item="${j}" data-item-field="quantity" ${m.confirmed?'disabled':''}></label><p id="item-total-${i}-${j}">${((f?.kcal||0)*x.quantity).toFixed(1)} kcal / ${((f?.protein||0)*x.quantity).toFixed(1)} g 蛋白质</p>${j?`<button data-action="remove-food" data-meal="${i}" data-item="${j}" ${m.confirmed?'disabled':''}>删除副食品</button>`:''}</div>`}

function pace(e){if(!e.distance||!e.minutes)return '—';const secs=Math.round(e.minutes/e.distance*60);return `${Math.floor(secs/60)}′${String(secs%60).padStart(2,'0')}″/km`}
function food(){return `${progress()}${day().meals.map((m,i)=>`<div class="card"><div class="row between"><h3>${MEALS[i]}</h3><span class="badge">${m.confirmed?'✓ 已确认':'草稿·待确认'}</span></div>${mealAdvice(m,i)}${m.items.map((x,j)=>mealItem(m,i,x,j)).join('')}<button data-action="add-food" data-meal="${i}" ${m.confirmed?'disabled':''}>＋ 添加副食品</button><label>备注<textarea maxlength="2000" data-meal="${i}" data-food="note" ${m.confirmed?'disabled':''}>${esc(m.note)}</textarea></label>${photoInput('food',i)}${photosHTML(m.photos,'food',i)}<details><summary>手动营养 / AI 估算结果</summary><div class="grid" style="grid-template-columns:1fr 1fr">${['kcal','protein'].map(k=>`<label>${k==='kcal'?'热量 kcal':'蛋白质 g'}<input type="number" min="0" max="${k==='kcal'?20000:2000}" step="0.1" value="${m[k]}" data-meal="${i}" data-food="${k}" ${m.confirmed?'disabled':''}></label>`).join('')}</div></details><p>本餐汇总：<strong id="meal-total-${i}">${m.kcal} kcal / ${m.protein} g 蛋白质</strong></p><div class="row"><button data-action="estimate" data-meal="${i}" ${aiBusy||m.confirmed?'disabled':''}>${aiBusy?'AI 请求中…':'AI 估算这餐'}</button><button class="primary" data-action="confirm-meal" data-meal="${i}">${m.confirmed?'✓ 已确认 · 修改':'确认提交'}</button></div>${m.foods?`<p>${m.foods.map(f=>esc(f.name)).join('、')} · AI 估算，请核对</p>`:''}<p class="muted">确认后计入今日营养。食物库为估算值；AI 会发送本餐照片和备注。</p></div>`).join('')}<div class="card"><h3>自定义食物 · 加入个人库</h3><label>名称<input id="custom-food-name" maxlength="100"></label><label>单位<input id="custom-food-unit" maxlength="20" value="份"></label><label>每单位热量 kcal<input id="custom-food-kcal" type="number" min="0" max="20000"></label><label>每单位蛋白质 g<input id="custom-food-protein" type="number" min="0" max="2000"></label><button data-action="custom-food">保存到个人库</button></div>`}

function weekDates(d=selected){const c=new Date(d+'T12:00:00');c.setDate(c.getDate()-(c.getDay()+6)%7);return Array.from({length:7},(_,i)=>{const x=new Date(c);x.setDate(x.getDate()+i);return dateKey(x)})}
function weekStats(d=selected){const dates=weekDates(d),s={dates,frequency:[0,0,0,0],sessions:0,sets:0,volume:0,km:0,minutes:0,proteinDays:0,loggedDays:0};for(const dt of dates){const a=state.days[dt];if(!a)continue;s.loggedDays++;const p=totals(a).protein;if(p>=125&&p<=155)s.proteinDays++;const t=a.training;if(t?.status==='complete'){s.sessions++;s.frequency[t.type]++;for(const e of t.exercises.filter(e=>e.done)){if(isRun(e)){s.km+=e.distance;s.minutes+=e.minutes}else{s.sets+=e.sets.length;s.volume+=exerciseVolume(e)}}}}return s}
function dailyText(){const d=day(),t=d.training,p=totals(d).protein;return `训练完成度：${t?`${t.exercises.filter(e=>e.done).length}/${t.exercises.length} 项，${t.status==='complete'?'已完成训练':'进行中'}`:'尚未开始'}。蛋白质 ${p.toFixed(1)} g，${proteinLabel(p)}。${goalText()}。已确认热量 ${Math.round(totals(d).kcal)} kcal。连续训练打卡 ${streak()} 天。`}
function ruleReport(s){const strong=NAMES.filter((n,i)=>s.frequency[i]>0),weak=NAMES.filter((n,i)=>s.frequency[i]===0);return `练得好的部位\n${strong.length?strong.map(n=>`${n} ${s.frequency[NAMES.indexOf(n)]} 次`).join('；'):'本周暂无已完成训练，先建立稳定打卡习惯。'}\n\n薄弱部位\n${weak.length?weak.join('、')+' 尚未记录；不必补偿性加量。':'四种训练均有记录，继续关注恢复。'}\n\n下周动作注意事项\n按恢复情况轮换分化，保持动作可控；不适时停止。\n${SAFETY}\n\n饮食调整建议\n蛋白质达标 ${s.proteinDays}/7 天（${Math.round(s.proteinDays/7*100)}%），已记录 ${s.loggedDays}/7 天。优先补齐记录，并将每日蛋白质分配到各餐，${goalText()}。结合体重趋势调整摄入。\n\n训练量：力量 ${s.sets} 组，记录负重总量 ${s.volume.toFixed(1)} kg·次；跑步 ${s.km.toFixed(1)} km / ${s.minutes.toFixed(1)} 分钟。自重动作不计入负重总量。`}
function report(){const s=weekStats(),r=state.reports[s.dates[0]];return `<div class="card"><h2>每日小结</h2><p>${esc(dailyText())}</p><button data-action="daily" ${aiBusy?'disabled':''}>${aiBusy?'正在生成…':'生成今日 AI 小结'}</button>${day().summary?`<p class="muted">${esc(day().summary.source)}</p><pre>${esc(day().summary.text)}</pre>`:''}${safety()}</div><div class="card"><h2>本周评估</h2><p class="muted">${s.dates[0]} — ${s.dates[6]} · 周日打开报告会自动生成规则版，随时可手动更新。</p><div class="week">${s.dates.map((dt,i)=>`<div class="day ${state.days[dt]?.training?.status==='complete'?'done':''}">${['一','二','三','四','五','六','日'][i]}<br>${state.days[dt]?.training?.status==='complete'?'✓':'·'}</div>`).join('')}</div><p>${NAMES.map((n,i)=>`${n} ${s.frequency[i]} 次`).join(' · ')}</p><button class="primary" data-action="weekly" ${aiBusy?'disabled':''}>${aiBusy?'正在生成…':'生成周报'}</button>${r?`<p class="muted">${esc(r.source)} · ${esc(r.updated)}</p><pre>${esc(r.text)}</pre>`:'<p class="muted">还没有周报。无 Key 时也能生成。</p>'}${safety()}</div><div class="card"><h3>体重趋势 · 目标 ${state.goals.targetWeight} kg</h3><canvas id="weight-chart" role="img" aria-label="体重曲线，目标 ${state.goals.targetWeight} 公斤"></canvas><p class="muted">绿色虚线：${state.goals.targetWeight} kg 目标；灰色虚线：最早记录体重。</p></div>`}
function photoStorage(){let chars=0,count=0;for(const d of Object.values(state.days)){for(const p of [...d.photos,...d.meals.flatMap(m=>m.photos)]){chars+=p.length;count++}}return {count,kb:Math.ceil(chars*2/1024)}}
function me(){const ps=photoStorage();return `<div class="card"><h2>目标设置</h2><p>当前体重：${currentWeight(state)===null?'未记录':currentWeight(state)+' kg'}</p><label>目标体重 kg<input type="number" min="40" max="200" step="0.5" value="${state.goals.targetWeight}" data-goal="targetWeight"></label><fieldset><legend>方向</legend><div class="directions">${['增肌','减脂','保持'].map(d=>`<label><input type="radio" name="direction" value="${d}" data-goal="direction" ${state.goals.direction===d?'checked':''}>${d}</label>`).join('')}</div></fieldset><label>每日热量预算 kcal<input type="number" min="1" max="20000" step="1" value="${state.goals.calorieBudget}" data-goal="calorieBudget"></label><button data-action="recommend">使用推荐值</button></div><div class="card"><h2>我的目标</h2><p>liu · 男 · 183 cm · 训练约 8 个月</p><p>当前 ${currentWeight(state)??'未记录'} kg → 目标 <strong class="green">${state.goals.targetWeight} kg</strong></p><p>卧推 70 kg · 引体向上 8–10 个</p><label>${selected} 体重 kg<input id="weight" type="number" min="30" max="300" step="0.1" inputmode="decimal" value="${day().weight??''}" placeholder="例如 77.5"></label><button class="primary" data-action="weight">保存今日体重</button></div><div class="card"><h3>DeepSeek 设置</h3><label>API Key（仅保存在本机）<input id="api-key" type="password" autocomplete="off" placeholder="sk-…" value="${esc(apiKey)}"></label><div class="row"><button data-action="key">保存 Key</button><button data-action="delete-key">清除 Key</button></div><p class="muted">只有点击 AI 按钮时，Key 才作为认证凭证直接发送给 api.deepseek.com；不经过其他服务器、不包含在 JSON 备份中。API 服务按其规则计费，可使用国内充值通道。</p><p class="muted">模型：deepseek-chat。接口拒绝图片输入时，请改用手动录入。</p></div><div class="card"><h3>本地数据与备份</h3><p class="muted">照片 ${ps.count} 张 · 估算 UTF-16 占用 ${ps.kb} KB。每张照片 data URL 保守估算 ≤150 KB。</p><div class="row"><button class="primary" data-action="export">导出 JSON 备份</button><button data-action="copy">复制备份文本</button></div><label class="file">导入 JSON 备份<input id="import" type="file" accept="application/json,.json"></label><p class="muted">导入会替换手账数据，保留本机 Key。先导出当前数据。浏览器清理、隐私模式或更换文件位置可能使本地记录丢失。</p><label>清理此日期之前的照片<input id="clean-date" type="date" value="${selected}"></label><button class="danger" data-action="clean">清理旧照片（保留训练与饮食数值）</button><details><summary>手机使用说明</summary><p>单文件可离线使用。iPhone 请通过 Safari 打开；“添加到主屏幕”的可用性取决于打开方式。若“文件”预览不执行脚本，请将 HTML 放在静态网页地址，再用 Safari 访问。照片需相机权限；也可从相册选择。</p><p>训练和饮食草稿自动保存，饮食确认后计入汇总；存储受限时转为预览模式，仅保留本次会话数据，请及时导出备份。</p></details><p class="muted">存储状态：${mode==='local'?'本地模式：数据保存在本机':'预览模式：数据仅本次会话有效，请及时备份'}</p></div>${safety()}`}
function render(){document.getElementById('goal-badge').textContent=`liu · ${state.goals.targetWeight} kg`;document.getElementById('date').value=selected;document.getElementById('date-caption').textContent=selected===dateKey()?'今天':'历史记录';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('view').innerHTML=(recoveryError?`<div class="card notice red" role="alert">⚠️ 本地数据恢复失败（${esc(recoveryError)}），已暂停覆盖写入以保护原数据。<p>在本预览中记录的数据关闭页面后会丢失，请尽快导出备份。</p><div class="row"><button data-action="export-raw">导出原始数据</button><button data-action="clear-raw">清空并重来</button></div></div>`:mode==='memory'?'<div class="card safety" role="status">⚠️ 预览模式：数据仅本次会话有效<p>在本预览中记录的数据关闭页面后会丢失，请尽快导出备份。</p><div class="row"><button data-action="export">导出备份</button><button data-action="copy">复制备份</button></div></div>':'')+({home,train,food,report,me})[tab]();if(celebration)document.getElementById('view').innerHTML+=`<div class="celebration" role="dialog" aria-modal="true" aria-label="训练完成"><div class="big tick">✓</div><h2>今天的训练完成了！</h2><p>${celebration.actions} 个动作 · ${celebration.sets} 组</p><p>${celebration.volume} kg 总训练量</p><button class="primary" data-action="celebration-close" ${celebrationReady?'':'disabled'}>${celebrationReady?'查看今日小结':'3 秒后可查看小结'}</button></div>`;if(tab==='report')drawChart()}
function drawChart(){const canvas=document.getElementById('weight-chart');if(!canvas)return;const w=canvas.clientWidth||320,h=240,dpr=window.devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');if(!c)return;c.scale(dpr,dpr);const points=Object.entries(state.days).filter(([,d])=>d.weight!==null).sort(([a],[b])=>a.localeCompare(b));const lo=Math.min(state.goals.targetWeight,...points.map(([,d])=>d.weight))-0.5,hi=Math.max(state.goals.targetWeight,...points.map(([,d])=>d.weight))+0.5;const y=v=>h-35-(v-lo)/(hi-lo)*(h-65),l=45,r=w-16;const t=dt=>new Date(dt+'T12:00:00').getTime();const min=points.length?t(points[0][0]):0,max=points.length?t(points.at(-1)[0]):1;const x=dt=>points.length<=1?(l+r)/2:l+(t(dt)-min)/(max-min)*(r-l);c.font='12px system-ui';for(const v of [points[0]?.[1].weight??goalWeight(),state.goals.targetWeight]){c.strokeStyle=v===state.goals.targetWeight?'#b5ef72':'#7c8b80';c.setLineDash([5,5]);c.beginPath();c.moveTo(l,y(v));c.lineTo(r,y(v));c.stroke();c.fillStyle=c.strokeStyle;c.fillText(v+' kg',2,y(v)+4)}c.setLineDash([]);c.strokeStyle='#b5ef72';c.lineWidth=2;c.beginPath();points.forEach(([dt,d],i)=>i?c.lineTo(x(dt),y(d.weight)):c.moveTo(x(dt),y(d.weight)));c.stroke();points.forEach(([dt,d])=>{c.fillStyle='#b5ef72';c.beginPath();c.arc(x(dt),y(d.weight),4,0,Math.PI*2);c.fill();c.fillStyle='#edf5ef';c.fillText(d.weight.toFixed(1),Math.max(l,Math.min(r-30,x(dt)-10)),y(d.weight)-10)});c.fillStyle='#a8b9ad';if(points.length){c.fillText(points[0][0].slice(5),l,h-10);if(points.length>1)c.fillText(points.at(-1)[0].slice(5),r-42,h-10)}else c.fillText('到“我的”记录第一笔体重',l,125)}
async function compressPhoto(file){if(!file.type.startsWith('image/'))throw Error('请选择图片');if(file.size>30*1024*1024)throw Error('原图超过 30 MB，请选择较小图片');const url=URL.createObjectURL(file);try{const img=await new Promise((resolve,reject)=>{const i=new Image();const timer=setTimeout(()=>reject(Error('图片解码超时')),15000);i.onload=()=>{clearTimeout(timer);resolve(i)};i.onerror=()=>{clearTimeout(timer);reject(Error('图片无法解码，请改用 JPEG / PNG'))};i.src=url});let scale=Math.min(1,960/Math.max(img.naturalWidth,img.naturalHeight));const cv=document.createElement('canvas');for(let n=0;n<16;n++){cv.width=Math.max(1,Math.round(img.naturalWidth*scale));cv.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);const data=cv.toDataURL('image/jpeg',0.72);if(data.startsWith('data:image/jpeg;base64,')&&data.length*2<=150*1024)return data;scale*=0.82}throw Error('图片压缩后仍过大，请选较小图片')}finally{URL.revokeObjectURL(url)}}
async function addPhotos(files,kind,meal){if(photoBusy)return;photoBusy=true;const date=selected;render();let saved=0;try{for(const file of Array.from(files)){const p=await compressPhoto(file);if(!editDay(d=>{if(kind==='train')d.photos.push(p);else {d.meals[meal].photos.push(p);d.meals[meal].confirmed=false}},date))break;saved++}toast(`已保存 ${saved} 张照片`)}catch(e){toast(`已保存 ${saved} 张；${e.message}`)}finally{photoBusy=false;render()}}
async function callAI(messages,json=false){if(!apiKey)throw Error('未配置 Key');const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),25000);try{const response=await fetch('https://api.deepseek.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+apiKey},body:JSON.stringify({model:'deepseek-chat',messages,temperature:0.3,max_tokens:1800,...(json?{response_format:{type:'json_object'}}:{})}),signal:controller.signal});if(!response.ok)throw Error('API '+response.status);const result=await response.json();const text=result.choices?.[0]?.message?.content;if(typeof text!=='string'||!text.trim())throw Error('AI 返回空内容');return text}catch(e){throw Error(e.name==='AbortError'?'请求超时':e.message)}finally{clearTimeout(timer)}}
function parseFoods(text){const data=JSON.parse(text.replace(/^\s*```(?:json)?\s*/,'').replace(/\s*```\s*$/,''));if(!Array.isArray(data.foods)||!data.foods.length||data.foods.length>50)throw Error('食物结果格式无效');return data.foods.map(f=>{if(typeof f.name!=='string'||!f.name.trim()||f.name.length>100)throw Error('食物名称无效');for(const k of ['grams','kcal','protein'])if(typeof f[k]!=='number'||!Number.isFinite(f[k])||f[k]<0||f[k]>(k==='protein'?2000:20000))throw Error('营养结果无效');return {name:f.name,grams:f.grams,kcal:f.kcal,protein:f.protein}})}
async function estimate(i){if(aiBusy)return;if(!apiKey){toast('未配置 Key，请直接填写热量和蛋白质。');return}const date=selected,m=clone(day().meals[i]),snapshot=JSON.stringify(m);if(!m.photos.length){toast('请先拍照，或直接手动输入营养值。');return}aiBusy=true;render();try{const text=await callAI([{role:'system',content:'你是食物营养估算助手。只输出 JSON：{"foods":[{"name":"食物","grams":100,"kcal":120,"protein":10}]}。数字不得为负；依据图片和备注估算，不确定时保守估计。'},{role:'user',content:[{type:'text',text:m.note||'请估算这餐食物的份量、热量与蛋白质'},...m.photos.map(p=>({type:'image_url',image_url:{url:p}}))]}],true);const foods=parseFoods(text),kcal=foods.reduce((s,f)=>s+f.kcal,0),protein=foods.reduce((s,f)=>s+f.protein,0);if(kcal>20000||protein>2000)throw Error('汇总营养值超出合理范围');if(JSON.stringify(day(date).meals[i])!==snapshot)throw Error('这餐已被修改，保留最新手动数据');if(editDay(d=>Object.assign(d.meals[i],{foods,kcal:Math.round(kcal*10)/10,protein:Math.round(protein*10)/10,source:'AI',items:[{name:'',quantity:1}],confirmed:false}),date))toast('AI 估算已保存，请核对份量和数值。')}catch(e){toast('AI 估算未保存：'+e.message+'。请手动填写，原数据已保留。')}finally{aiBusy=false;render()}}
async function generateWeekly(){if(aiBusy)return;const s=weekStats(),id=s.dates[0];let text=ruleReport(s),source='离线规则版';if(apiKey){aiBusy=true;render();try{text=await callAI([{role:'system',content:'用中文输出四部分：练得好的部位 / 薄弱部位 / 下周动作注意事项 / 饮食调整建议。不要诊断，不推荐颈椎高风险动作。必须包含颈椎安全提醒。'},{role:'user',content:`本周训练量统计与各部位训练频率：${JSON.stringify({...s,frequency:Object.fromEntries(NAMES.map((n,i)=>[n,s.frequency[i]]))})}。蛋白质达标天数 ${s.proteinDays}/7，${goalText()}。身体资料：${bodyText()}。${SAFETY}`}]);if(!['练得好的部位','薄弱部位','下周动作注意事项','饮食调整建议'].every(x=>text.includes(x)))throw Error('报告结构不完整');text+='\n\n'+SAFETY;source='DeepSeek AI 版'}catch(e){toast('AI 周报失败：'+e.message+'，已使用规则版。')}finally{aiBusy=false}}if(mutate(next=>next.reports[id]={text,source,updated:new Date().toLocaleString('zh-CN')}))toast(source+'周报已保存');render()}
async function generateDaily(){if(aiBusy)return;const date=selected,d=clone(day()),base=dailyText();let text=base+'\n'+SAFETY,source='离线规则版';if(apiKey){aiBusy=true;render();try{text=await callAI([{role:'system',content:'根据记录用中文写简短每日小结：训练完成度、蛋白质是否达标、连续打卡天数和明日恢复注意事项。不得推荐颈椎高风险动作，必须含颈椎安全提醒。'},{role:'user',content:JSON.stringify({date,training:d.training,nutrition:totals(d),weight:d.weight,summary:base,goals:state.goals,body:bodyText()})+'\n'+SAFETY}]);text+='\n\n'+SAFETY;source='DeepSeek AI 版'}catch(e){toast('AI 每日小结失败：'+e.message+'，已使用规则版。')}finally{aiBusy=false}}if(editDay(a=>a.summary={text,source},date))toast(source+'每日小结已保存');render()}
function validateBackup(raw){if(!raw||![1,2].includes(raw.version)||!Array.isArray(raw.templates)||raw.templates.length!==4||!raw.days||typeof raw.days!=='object'||Array.isArray(raw.days)||!raw.reports||typeof raw.reports!=='object'||Array.isArray(raw.reports))throw Error('备份结构或版本不支持');if(Object.keys(raw.days).length>10000)throw Error('记录过多');const num=(v,max)=>{if(typeof v!=='number'||!Number.isFinite(v)||v<0||v>max)throw Error('数值无效');return v},str=(v,max)=>{if(typeof v!=='string'||v.length>max)throw Error('文本无效');return v},exs=(list)=>{if(!Array.isArray(list)||list.length>100)throw Error('动作清单无效');return list.map(e=>{if(typeof e.done!=='boolean'||!e.name?.trim())throw Error('动作无效');if(!Array.isArray(e.sets)){num(e.sets,1000);num(e.reps,1000);num(e.weight,500)}const v=migrateExercise(e);v.name=str(e.name,80);if(typeof v.bodyweight!=='boolean'||typeof v.timed!=='boolean')throw Error('动作标记无效');v.part=str(v.part,20);v.step=num(v.step,5);if(![2.5,5].includes(v.step))throw Error('步长无效');if(!Array.isArray(v.sets)||!v.sets.length||v.sets.length>1000)throw Error('组列表无效');if(!Array.isArray(e.sets)){num(e.sets,1000);if(!Number.isInteger(e.sets))throw Error('组数无效')}v.sets=v.sets.map(g=>({reps:num(g.reps,1000),weight:num(g.weight,500)}));v.distance=num(v.distance,500);v.minutes=num(v.minutes,1440);delete v.reps;delete v.weight;return v})},photos=(list)=>{if(!Array.isArray(list)||list.length>1000)throw Error('照片清单无效');return list.map(p=>{if(typeof p!=='string'||!/^data:image\/jpeg;base64,[A-Za-z0-9+/]+={0,2}$/.test(p)||p.length*2>150*1024)throw Error('照片格式或体积无效');return p})};const out=defaults();if(raw.personalFoods){if(!Array.isArray(raw.personalFoods)||raw.personalFoods.length>500)throw Error('个人食物库无效');out.personalFoods=raw.personalFoods.map(f=>({name:str(f.name,100),unit:str(f.unit,20),kcal:num(f.kcal,20000),protein:num(f.protein,2000)}))}out.templates=raw.templates.map((t,i)=>({name:NAMES[i],exercises:exs(t.exercises)}));for(const [dt,d] of Object.entries(raw.days)){if(!validDate(dt)||!d||!Array.isArray(d.meals)||d.meals.length!==4)throw Error('日期或饮食结构无效');const a=emptyDay();a.photos=photos(d.photos);if(d.summary)a.summary={text:str(d.summary.text,30000),source:str(d.summary.source,100)};a.weight=d.weight===null?null:num(d.weight,300);if(a.weight!==null&&a.weight<30)throw Error('体重无效');a.meals=d.meals.map(m=>{const v={note:str(m.note,2000),kcal:num(m.kcal,20000),protein:num(m.protein,2000),photos:photos(m.photos),confirmed:raw.version===1?true:m.confirmed,items:m.items||[{name:'',quantity:1}]} ;if(typeof v.confirmed!=='boolean'||!Array.isArray(v.items)||!v.items.length||v.items.length>100)throw Error('餐食无效');v.items=v.items.map(x=>({name:str(x.name,100),quantity:num(x.quantity,100)}));if(['AI','手动','食物库'].includes(m.source))v.source=m.source;if(m.foods)v.foods=parseFoods(JSON.stringify({foods:m.foods}));return v});if(d.training!==null){const t=d.training;if(!t||!Number.isInteger(t.type)||t.type<0||t.type>3||!['active','complete'].includes(t.status))throw Error('训练无效');a.training={type:t.type,status:t.status,exercises:exs(t.exercises)};if(t.status==='complete'&&(!a.training.exercises.length||a.training.exercises.some(e=>!e.done)))throw Error('完成状态无效')}Object.defineProperty(out.days,dt,{value:a,enumerable:true,writable:true,configurable:true})}for(const [dt,r] of Object.entries(raw.reports)){if(!validDate(dt))throw Error('周报日期无效');out.reports[dt]={text:str(r.text,30000),source:str(r.source,100),updated:str(r.updated,100)}}const g=raw.goals;out.goals=g&&typeof g.targetWeight==='number'&&Number.isFinite(g.targetWeight)&&g.targetWeight>=40&&g.targetWeight<=200&&g.targetWeight*2===Math.round(g.targetWeight*2)&&['增肌','减脂','保持'].includes(g.direction)&&typeof g.calorieBudget==='number'&&Number.isFinite(g.calorieBudget)&&g.calorieBudget>0&&g.calorieBudget<=20000?{targetWeight:g.targetWeight,direction:g.direction,calorieBudget:g.calorieBudget}:defaultGoals(out);return out}
function backupText(){return JSON.stringify(state,null,2)}
function downloadBackup(){const url=URL.createObjectURL(new Blob([backupText()],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='gain-log-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);if(mode==='local')toast('备份已导出；若 Safari 未下载，请使用“复制备份文本”。')}
async function importFile(file){if(!file)return;if(file.size>25*1024*1024){toast('备份超过 25 MB，未导入');return}try{const next=validateBackup(JSON.parse(await file.text()));if(!confirm('导入将替换当前训练、饮食、照片和体重。确认已备份当前数据？'))return;if(commit(next)){toast('备份导入成功，本机 Key 保持不变。');render()}}catch(e){toast('导入失败：'+e.message+'；原数据未改变。')}}
async function action(a,el){const t=day().training;if(['start','reset-training','add-ex','remove-ex','save-template'].includes(a))finishPending=null;switch(a){case 'export-raw':{const raw=localStorage.getItem(STORE);if(raw===null){toast('没有原始数据可导出');return}const url=URL.createObjectURL(new Blob([raw],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download='gainlog-raw-backup-'+dateKey()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}case 'clear-raw':if(confirm('将删除本机旧数据，确认已导出原始数据？')){localStorage.removeItem(STORE);location.reload()}return;case 'recommend':mutate(s=>s.goals.calorieBudget=recommend(goalWeight(),s.goals.direction));break;case 'start':{const type=Number(document.getElementById('template').value);if(!state.templates[type].exercises.length){toast('模板没有动作，请恢复或添加动作');break}editDay(d=>d.training={type,status:'active',exercises:clone(state.templates[type].exercises).map(e=>({...e,done:false}))});break}case 'reset-training':if(confirm('撤销当天训练打卡？照片会保留。'))editDay(d=>d.training=null);break;case 'add-ex':if(t)editDay(d=>{d.training.exercises.push(migrateExercise({name:t.type===3?'慢跑':'新动作',sets:1,reps:10,weight:0,distance:0,minutes:0,done:false}));d.training.status='active'});break;case 'remove-ex':if(t)editDay(d=>{d.training.exercises.splice(Number(el.dataset.index),1);d.training.status='active'});break;case 'save-template':if(t?.exercises.length&&mutate(s=>s.templates[t.type].exercises=clone(t.exercises).map(e=>({...e,done:false}))))toast('模板已保存');break;case 'finish':if(photoBusy){toast('请等待照片保存完成');break}if(!t?.exercises.length||t.exercises.some(e=>!e.done)){toast('请逐项打卡，或删除不适合的动作');break}if(t.exercises.some(e=>isRun(e)?(!e.distance||!e.minutes):(!e.sets.length||e.sets.some(g=>!g.reps)))){toast('请填写有效组数、次数或跑步距离、时长');break}if(finishPending!==selected){finishPending=selected;break}finishPending=null;editDay(d=>d.training.status='complete');celebration={actions:t.exercises.length,sets:t.exercises.filter(e=>!isRun(e)).reduce((n,e)=>n+e.sets.length,0),volume:t.exercises.reduce((n,e)=>n+exerciseVolume(e),0)};celebrationReady=false;setTimeout(()=>{celebrationReady=true;render()},3000);break;case 'celebration-close':if(celebrationReady){celebration=null;tab='report'}break;
case 'step':case 'add-set':case 'remove-set':{const i=Number(el.dataset.index),j=Number(el.dataset.set),e=t?.exercises[i];if(!e||isRun(e))break;editDay(d=>{const x=d.training.exercises[i];if(a==='add-set'&&x.sets.length<1000)x.sets.push(clone(x.sets.at(-1)));if(a==='remove-set'&&x.sets.length>1)x.sets.splice(j,1);if(a==='step'&&x.sets[j])x.sets[j].weight=Math.max(0,Math.min(500,x.sets[j].weight+Number(el.dataset.dir)*x.step));x.done=false;d.training.status='active'});finishPending=null;break}
case 'confirm-meal':{const i=Number(el.dataset.meal);editDay(d=>{const m=d.meals[i];m.confirmed=!m.confirmed});warnOnce(i);break}
case 'add-food':case 'remove-food':{const i=Number(el.dataset.meal);if(day().meals[i].confirmed)break;editDay(d=>{const m=d.meals[i];if(a==='add-food'&&m.items.length<100)m.items.push({name:'',quantity:1});if(a==='remove-food')m.items.splice(Number(el.dataset.item),1);calculateMeal(m)});break}
case 'custom-food':{const f={name:document.getElementById('custom-food-name').value.trim(),unit:document.getElementById('custom-food-unit').value.trim(),kcal:Number(document.getElementById('custom-food-kcal').value),protein:Number(document.getElementById('custom-food-protein').value)};if(!f.name||!f.unit||!Number.isFinite(f.kcal)||f.kcal<0||f.kcal>20000||!Number.isFinite(f.protein)||f.protein<0||f.protein>2000||foodInfo(f.name)||state.personalFoods.length>=500){toast('请填写有效且不重复的食物');break}mutate(s=>s.personalFoods.push(f));toast('个人食物已保存');break}
case 'weight':{const v=Number(document.getElementById('weight').value);if(v<30||v>300||!Number.isFinite(v)){toast('请输入 30–300 kg 的体重');break}if(editDay(d=>d.weight=Math.round(v*10)/10)&&mode==='local')toast('体重已保存');break}case 'key':{const key=document.getElementById('api-key').value.trim();apiKey=key;try{if(key)localStorage.setItem(KEY,key);else localStorage.removeItem(KEY);toast(key?'Key 已保存在本机':'Key 已清除')}catch{memoryMode();toast('Key 仅本次会话有效，关闭页面需重填')}break}case 'delete-key':apiKey='';try{localStorage.removeItem(KEY);toast('Key 已清除')}catch{memoryMode();toast('Key 已在本次会话清除，存储受限，原本机 Key 可能仍保留')}break;case 'estimate':await estimate(Number(el.dataset.meal));return;case 'weekly':await generateWeekly();return;case 'daily':await generateDaily();return;case 'delete-photo':editDay(d=>{const list=el.dataset.kind==='train'?d.photos:d.meals[Number(el.dataset.meal)].photos;list.splice(Number(el.dataset.index),1)});break;case 'export':downloadBackup();return;case 'copy':try{await navigator.clipboard.writeText(backupText());toast('备份文本已复制')}catch{const blob=new Blob([backupText()],{type:'application/json'});const url=URL.createObjectURL(blob);window.open(url,'_blank');setTimeout(()=>URL.revokeObjectURL(url),60000);toast('剪贴板不可用，已尝试打开备份文本，可手动保存。')}return;case 'clean':{const before=document.getElementById('clean-date').value;if(!validDate(before)){toast('请选择有效日期');break}if(confirm(`清理 ${before} 之前所有照片？请确认已导出备份。`)&&mutate(s=>{for(const [dt,d] of Object.entries(s.days)){if(dt<before){d.photos=[];d.meals.forEach(m=>m.photos=[])}}}))toast('旧照片已清理，数值记录保留。');break}}render()}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.tab||el.dataset.go){tab=el.dataset.tab||el.dataset.go;if(tab==='report'&&new Date(selected+'T12:00:00').getDay()===0&&!state.reports[weekDates()[0]]){const s=weekStats();mutate(n=>n.reports[s.dates[0]]={text:ruleReport(s),source:'周日自动规则版',updated:new Date().toLocaleString('zh-CN')})}render();return}if(el.dataset.action)action(el.dataset.action,el).catch(err=>toast('操作失败：'+err.message))});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.goal){const k=el.dataset.goal,v=k==='direction'?el.value:Number(el.value);if(k==='direction'?!['增肌','减脂','保持'].includes(v):!Number.isFinite(v)||(k==='targetWeight'?(v<40||v>200||v*2!==Math.round(v*2)):(v<=0||v>20000))){toast('请输入有效目标或热量预算');render();return}mutate(s=>s.goals[k]=v);render();return}if(el.id==='date'){if(validDate(el.value)){selected=el.value;finishPending=null;celebration=null;render()}return}if(el.id==='import'){importFile(el.files[0]);return}if(el.dataset.photo){addPhotos(el.files,el.dataset.photo,Number(el.dataset.meal));return}if(el.dataset.item!==undefined){const i=Number(el.dataset.meal),j=Number(el.dataset.item),k=el.dataset.itemField,m=day().meals[i];if(!m||m.confirmed||!m.items[j])return;const v=k==='name'?el.value:Number(el.value);if(k==='quantity'&&(!Number.isFinite(v)||v<0||v>100)){toast('请输入有效份量');render();return}if(k==='name'&&v&&!foodInfo(v))return;editDay(d=>{d.meals[i].items[j][k]=v;calculateMeal(d.meals[i])});render();return}
if(el.dataset.ex!==undefined){const i=Number(el.dataset.ex),k=el.dataset.field,t=day().training;if(!t?.exercises[i])return;const v=k==='name'||k==='choice'?el.value.trim():k==='done'?el.checked:Number(el.value);if((k==='name'&&!v)||(k!=='name'&&k!=='choice'&&k!=='done'&&(!Number.isFinite(v)||v<0||!el.checkValidity()))){toast('请填写有效动作名称或非负数值');render();return}finishPending=null;editDay(d=>{const x=d.training.exercises[i];if(k==='choice'){const info=v==='custom'?{name:'自定义动作',part:'自定义',step:2.5,bodyweight:false,timed:false}:exerciseInfo(v);Object.assign(x,info);if(x.bodyweight)x.sets.forEach(g=>g.weight=0);x.done=false}else if(el.dataset.set!==undefined){x.sets[Number(el.dataset.set)][k]=v;x.done=false}else {x[k]=v;if(k!=='done')x.done=false}d.training.status='active'});if(k==='done'&&v){try{navigator.vibrate?.(30)}catch{}if(mode==='local')toast('✓ '+day().training.exercises[i].name+'完成')}render();return}if(el.dataset.food){const i=Number(el.dataset.meal),k=el.dataset.food,v=k==='note'?el.value:Number(el.value);if(k!=='note'&&(!Number.isFinite(v)||v<0||!el.checkValidity())){toast('请输入范围内的非负营养值');render();return}editDay(d=>{d.meals[i][k]=v;d.meals[i].confirmed=false;if(k!=='note'){delete d.meals[i].foods;d.meals[i].source='手动'}});render()}});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.itemField!=='quantity')return;const i=Number(el.dataset.meal),j=Number(el.dataset.item),v=Number(el.value),m=day().meals[i];if(!m||m.confirmed||!m.items[j]||!el.value||!Number.isFinite(v)||v<0||v>100)return;editDay(d=>{d.meals[i].items[j].quantity=v;calculateMeal(d.meals[i])});const next=day().meals[i],f=foodInfo(next.items[j].name);document.getElementById(`meal-total-${i}`).textContent=`${next.kcal} kcal / ${next.protein} g 蛋白质`;document.getElementById(`item-total-${i}-${j}`).textContent=`${((f?.kcal||0)*v).toFixed(1)} kcal / ${((f?.protein||0)*v).toFixed(1)} g 蛋白质`});
window.addEventListener('resize',()=>{if(tab==='report')drawChart()});
window.addEventListener('storage',e=>{if(e.key===STORE||e.key===KEY){toast('另一个页面修改了数据，请刷新后继续，避免覆盖。')}});
render();
</script></body></html>
